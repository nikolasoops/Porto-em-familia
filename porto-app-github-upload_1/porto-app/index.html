  :root {
    --bg: #eef3f8;
    --primary: #16406e;
    --primary-2: #1d4f85;
    --card: #ffffff;
    --accent: #d99a2b;
    --ink: #0f2438;
    --muted: #5c6b7a;
    --line: #e2e9f0;
    --kids: #1f6b3d;
    --kids-bg: #e7f1ea;
    --adults: #b5780f;

    color-scheme: light;

  html, body {

    background: var(--bg);
    color: var(--ink);
    overscroll-behavior-y: none;
  }
  #app { max-width: 480px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); position: relative; }

  /* ---------- header ---------- */

    flex: none;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px 12px;
    background: var(--primary);
    background-image:

    background-size: 22px 22px;
    color: #fff;
  }
  .app-title { font-size: 20px; font-weight: 800; margin: 0 0 12px; display:flex; align-items:center; justify-content:space-between; }
  .app-title small { font-size: 11px; font-weight: 600; opacity: 0.75; background: rgba(255,255,255,0.15); padding: 4px 8px; border-radius: 999px; }
  .header-right { display:flex; align-items:center; gap: 7px; }
  .lang-pill { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.15); color: #fff; font-family: inherit; cursor: pointer; }
  .lang-pill:active { background: rgba(255,255,255,0.3); }
  .search { display:flex; align-items:center; gap:8px; padding: 10px 13px; border-radius: 12px; font-size: 14px; background: rgba(255,255,255,0.16); color: #fff; }
  .search input { background: transparent; border: none; outline: none; color: #fff; font-size: 14px; flex: 1; font-family: inherit; }
  .search input::placeholder { color: rgba(255,255,255,0.75); }

  /* ---------- filters ---------- */
  .filterbar { flex: none; background: var(--bg); }
  .seg { display:flex; margin: 12px 18px 10px; border-radius: 12px; padding: 3px; background: #dfe7ef; }
  .seg button { flex:1; text-align:center; font-size:12.5px; font-weight:700; padding:8px 0; border-radius:9px; border:none; background:transparent; color: var(--primary); font-family: inherit; cursor: pointer; }
  .seg button.on { background: var(--primary); color: #fff; }
  .chiprow { display:flex; gap:7px; padding: 2px 18px 10px; overflow-x: auto; }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip { flex: none; font-size: 12px; padding: 7px 13px; border-radius: 999px; white-space: nowrap; font-weight: 600; background:#fff; color: var(--primary); border: 1px solid var(--line); cursor: pointer; font-family: inherit; }
  .chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .datepicker-wrap { padding: 0 18px 10px; }
  .date-input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 13px; font-family: inherit; }

  /* ---------- age filter ---------- */
  .age-filter { padding: 12px 18px 8px; }
  .age-btn { font-size: 12.5px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: #fff; color: var(--primary); border: 1px solid var(--line); cursor: pointer; font-family: inherit; }
  .age-btn.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .age-btn.open { border-color: var(--primary); }
  .age-panel { margin-top: 8px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .age-panel-chips { display:flex; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; min-height: 20px; }
  .age-panel-hint { font-size: 12px; color: var(--muted); }
  .age-chip { display:flex; align-items:center; gap: 5px; font-size: 12px; font-weight: 700; padding: 5px 6px 5px 10px; border-radius: 999px; background: var(--kids-bg); color: var(--kids); }
  .age-chip button { border: none; background: none; color: inherit; font-size: 13px; cursor: pointer; padding: 0 2px; line-height: 1; }
  .age-panel-add { display:flex; gap: 8px; }
  .age-panel-add input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; font-family: inherit; }
  .age-panel-add button { flex: none; padding: 9px 14px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-weight: 700; font-size: 12.5px; font-family: inherit; cursor: pointer; }

  /* ---------- list ---------- */
  .content { flex: 1; overflow-y: auto; padding-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .section-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); padding: 14px 18px 8px; }
  .empty { padding: 40px 24px; text-align:center; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .list { padding: 0 18px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display:flex; gap:11px; cursor: pointer; text-align: left; }
  .thumb { width: 52px; height: 52px; border-radius: 12px; flex: none; display:flex; align-items:center; justify-content:center; font-size: 21px; background: #e7eef5; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-size: 13.5px; font-weight: 700; margin: 0 0 3px; line-height: 1.3; color: var(--ink); }
  .card-meta { font-size: 11.5px; margin: 0 0 7px; color: var(--muted); }
  .card-tags { display:flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .tag.kids { background: var(--kids-bg); color: var(--kids); }
  .tag.adults { background: var(--adults-bg); color: var(--adults); }
  .tag.cat { background: #eef3f8; color: var(--primary); }

  .navitem.active { color: var(--primary); }

  .modal-backdrop.open { display: flex; }
  .modal {

  .btn.primary { background: var(--primary); color: #fff; }

  .install-banner {
    margin: 10px 18px 0; background: var(--accent); color: #fff; border-radius: 12px;

  .install-banner button { background: rgba(255,255,255,0.25); border: none; color: #fff; font-weight: 700; font-size: 11.5px; padding: 6px 10px; border-radius: 8px; font-family: inherit; cursor: pointer; }

  .badge-soon { font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--danger); color: #fff; }
</style>
</head>

/* ===================== DATE HELPERS ===================== */
function todayMidnight() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
// Does event ev cover calendar day `target` (a Date at midnight)?
function coversDay(ev, target) {
  if (ev.ongoing) return true;
  const t = target.getTime();
  if (ev.dateStart && ev.dateEnd) {
    return t >= new Date(ev.dateStart + 'T00:00:00').getTime() && t <= new Date(ev.dateEnd + 'T00:00:00').getTime();
  }
  if (ev.date) {
    return new Date(ev.date + 'T00:00:00').getTime() === t;
  }
  return true;
}
// Dated events that finished before today quietly drop out of every view (ongoing ones never do).
function isPastEvent(ev) {
  if (ev.ongoing) return false;
  const endStr = ev.dateEnd || ev.date;
  if (!endStr) return false;
  return new Date(endStr + 'T00:00:00').getTime() < todayMidnight().getTime();
}
function matchesDate(ev) {
  const today = todayMidnight();
  switch (state.dateMode) {
    case 'all': return true;
    case 'today': return coversDay(ev, today);
    case 'weekend': {
      const day = today.getDay(); // 0 Sun .. 6 Sat
      const satOffset = day === 6 ? 0 : (6 - day + 7) % 7;
      const sunOffset = day === 0 ? 0 : (7 - day) % 7;
      return coversDay(ev, addDays(today, satOffset)) || coversDay(ev, addDays(today, sunOffset));
    }
    case 'custom':
      if (!state.customDate) return true;
      return coversDay(ev, new Date(state.customDate + 'T00:00:00'));
    default: return true;
  }
}

/* ===================== FILTER LOGIC ===================== */
// With no children set, no age filtering happens (kids + adult events both show).
// With one or more children set, an event matches if it's a good fit for at
// least one of them (its age range overlaps that child's age).
function ageMatches(ev) {
  if (!state.childAges.length) return true;
  const lo = typeof ev.ageMin === 'number' ? ev.ageMin : 0;
  const hi = typeof ev.ageMax === 'number' ? ev.ageMax : Infinity;
  return state.childAges.some(age => age >= lo && age <= hi);
}
function matches(ev) {
  if (isPastEvent(ev)) return false;
  if (!ageMatches(ev)) return false;
  if (state.cats.size && !state.cats.has(ev.cat)) return false;
  if (!matchesDate(ev)) return false;
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    const hay = `${ev.title} ${ev.title_en || ''} ${ev.venue}`.toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

const contentEl = document.getElementById('content');

function renderAgeFilter() {
  const wrap = document.getElementById('ageFilter');
  const sorted = state.childAges.slice().sort((a, b) => a - b);
  const unit = state.lang === 'en' ? (n => n === 1 ? 'yr' : 'yrs') : (n => n === 1 ? 'ano' : 'anos');
  const label = sorted.length ? `👶 ${sorted.join(', ')} ${unit(sorted.length)}` : `👶 ${t('ageFilterLabel')}`;
  let html = `<button class="age-btn ${sorted.length ? 'on' : ''} ${state.ageFilterOpen ? 'open' : ''}" id="ageFilterBtn">${label}</button>`;
  if (state.ageFilterOpen) {
    html += `<div class="age-panel">
      <div class="age-panel-chips">${
        sorted.length
          ? state.childAges.map((age, i) => `<span class="age-chip">${age} ${unit(age === 1 ? 1 : 2)}<button data-remove-age="${i}">×</button></span>`).join('')
          : `<span class="age-panel-hint">${t('ageFilterHint')}</span>`
      }</div>
      <div class="age-panel-add">
        <input type="number" min="0" max="18" step="0.5" id="ageInput" placeholder="${t('ageFilterPlaceholder')}" />
        <button id="ageAddBtn">${t('ageFilterAdd')}</button>
      </div>
    </div>`;
  }
  wrap.innerHTML = html;
  document.getElementById('ageFilterBtn').onclick = () => { state.ageFilterOpen = !state.ageFilterOpen; render(); };
  if (state.ageFilterOpen) {
    wrap.querySelectorAll('[data-remove-age]').forEach(btn => {
      btn.onclick = () => { state.childAges.splice(Number(btn.dataset.removeAge), 1); persistChildAges(); render(); };
    });
    const addBtn = document.getElementById('ageAddBtn');
    const input = document.getElementById('ageInput');
    const doAdd = () => {
      const v = parseFloat(input.value);
      if (!isNaN(v) && v >= 0) { state.childAges.push(v); persistChildAges(); input.value = ''; render(); }
    };
    addBtn.onclick = doAdd;
    input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } };
  }
}

function renderFilters() {
  renderAgeFilter();

  const dateRow = document.getElementById('dateRow');
  dateRow.innerHTML = '';
  const datePresets = [
    ['today', t('dateToday')],
    ['weekend', t('dateWeekend')],
    ['custom', t('datePick')],
  ];
  datePresets.forEach(([key, label]) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.dateMode === key ? ' on' : '');
    chip.textContent = key === 'custom' && state.dateMode === 'custom' && state.customDate ? `📅 ${formatDate(state.customDate)}` : label;
    chip.onclick = () => {
      // Tapping an already-active chip clears it back to "all dates".
      state.dateMode = state.dateMode === key ? 'all' : key;
      render();
      if (state.dateMode === 'custom') document.getElementById('customDateInput').focus();
    };
    dateRow.appendChild(chip);
  });
  const datePickerWrap = document.getElementById('datePickerWrap');
  datePickerWrap.style.display = state.dateMode === 'custom' ? 'block' : 'none';
  if (state.dateMode === 'custom') {
    const input = document.getElementById('customDateInput');
    input.value = state.customDate || '';
    input.onchange = (e) => { state.customDate = e.target.value; render(); };
  }

  const chipRow = document.getElementById('chipRow');
  chipRow.innerHTML = '';
  CATEGORIES.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.cats.has(c.key) ? ' on' : '');
    chip.textContent = `${c.icon} ${catLabel(c)}`;
    chip.onclick = () => {
      if (state.cats.has(c.key)) state.cats.delete(c.key); else state.cats.add(c.key);
      render();
    };
    chipRow.appendChild(chip);
  });
}

// Saved-event reminders: a lightweight, in-app-only nudge (no push/backend) —
// events with a specific date show a badge when they land today or tomorrow.
function eventHappensOn(ev, day) {
  if (ev.ongoing) return false;
  return coversDay(ev, day);
}
function reminderBadgeFor(ev) {
  const today = todayMidnight();
  if (eventHappensOn(ev, today)) return 'today';
  if (eventHappensOn(ev, addDays(today, 1))) return 'tomorrow';
  return null;
}
function savedReminders() {
  const today = todayMidnight();
  const tomorrow = addDays(today, 1);
  const savedEvents = EVENTS.filter(ev => state.saved.has(ev.id) && !isPastEvent(ev));
  return {
    todayList: savedEvents.filter(ev => eventHappensOn(ev, today)),
    tomorrowList: savedEvents.filter(ev => eventHappensOn(ev, tomorrow)),
  };
}

function cardHtml(ev) {
  const isSaved = state.saved.has(ev.id);
  const badge = reminderBadgeFor(ev);
  const badgeHtml = badge ? `<span class="badge-soon">${badge === 'today' ? t('badgeToday') : t('badgeTomorrow')}</span>` : '';
  return `
    <div class="card" data-id="${ev.id}">
      <div class="thumb">${ev.icon}</div>
      <div class="card-body">
        <div class="card-title">${evTitle(ev)}</div>
        <div class="card-meta">${ev.venue} · ${evWhen(ev)}</div>
        <div class="card-tags">${badgeHtml}${tagsHtml(ev)}</div>
      </div>
      <button class="heart ${isSaved ? 'on' : ''}" data-save="${ev.id}">${isSaved ? '♥' : '♡'}</button>
    </div>
  `;
}

function attachCardHandlers(root) {
  root.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.heart')) return;
      openDetail(Number(card.dataset.id));
    });
  });
  root.querySelectorAll('[data-save]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.save);
      if (state.saved.has(id)) state.saved.delete(id); else state.saved.add(id);
      persistSaved();
      render();
    });
  });
}

function renderHome() {
  filterBarEl.style.display = '';
  const list = EVENTS.filter(matches);
  if (!list.length) {
    contentEl.innerHTML = `<div class="section-label">${dateFilterLabel()}</div><div class="empty">${t('emptyFilters')}<br>${t('emptyFiltersHint')}</div>`;
    return;
  }
  contentEl.innerHTML = `<div class="section-label">${dateFilterLabel()}</div><div class="list">${list.map(cardHtml).join('')}</div>`;
  attachCardHandlers(contentEl);
}

function renderExplore() {
  filterBarEl.style.display = '';
  const list = EVENTS.filter(matches);
  const byCat = {};
  list.forEach(ev => { (byCat[ev.cat] = byCat[ev.cat] || []).push(ev); });
  const cats = CATEGORIES.filter(c => byCat[c.key] && byCat[c.key].length);
  if (!cats.length) {
    contentEl.innerHTML = `<div class="empty">${t('emptyFilters')}</div>`;
    return;
  }
  contentEl.innerHTML = cats.map(c => `
    <div class="group">
      <div class="section-label">${c.icon} ${catLabel(c)}</div>
      <div class="list">${byCat[c.key].map(cardHtml).join('')}</div>
    </div>
  `).join('');
  attachCardHandlers(contentEl);
}

function renderSaved() {
  filterBarEl.style.display = 'none';
  const list = EVENTS.filter(ev => state.saved.has(ev.id));
  if (!list.length) {
    contentEl.innerHTML = `<div class="empty">${t('emptySaved')}<br>${t('emptySavedHint')}</div>`;
    return;
  }
  contentEl.innerHTML = `<div class="section-label">${t('savedLabel')}</div><div class="list">${list.map(cardHtml).join('')}</div>`;
  attachCardHandlers(contentEl);
}

function renderProfile() {
  filterBarEl.style.display = 'none';
  contentEl.innerHTML = `
    <div class="profile-card">
      <h3>${t('profileAboutTitle')}</h3>
      <p>${t('profileAboutText')}</p>
    </div>
    <div class="profile-card">
      <h3>${t('profileLangTitle')}</h3>
      <div class="lang-toggle">
        <button id="langPt" class="${state.lang === 'pt' ? 'on' : ''}">Português</button>
        <button id="langEn" class="${state.lang === 'en' ? 'on' : ''}">English</button>
      </div>
    </div>
    <div class="profile-card">
      <h3>${t('profileSuggestTitle')}</h3>
      <p>${t('profileSuggestText')}</p>
      <a class="btn primary" href="mailto:hello@example.com?subject=Sugest%C3%A3o%20de%20evento">${t('profileSuggestBtn')}</a>
    </div>
  `;
  document.getElementById('langPt').onclick = () => setLang('pt');
  document.getElementById('langEn').onclick = () => setLang('en');
}

function render() {
  document.getElementById('searchInput').placeholder = t('searchPlaceholder');
  document.getElementById('weekLabel').textContent = t('ageBadge');
  const headerLangBtn = document.getElementById('headerLangBtn');
  headerLangBtn.textContent = state.lang === 'en' ? 'EN' : 'PT';
  headerLangBtn.onclick = () => setLang(state.lang === 'en' ? 'pt' : 'en');
  document.querySelector('.navitem[data-tab="home"]').innerHTML = `<span class="ic">🏠</span>${t('navHome')}`;
  document.querySelector('.navitem[data-tab="explore"]').innerHTML = `<span class="ic">🧭</span>${t('navExplore')}`;
  document.querySelector('.navitem[data-tab="saved"]').innerHTML = `<span class="ic">♥</span>${t('navSaved')}`;
  document.querySelector('.navitem[data-tab="profile"]').innerHTML = `<span class="ic">👤</span>${t('navProfile')}`;
  document.querySelector('#installBanner span').textContent = t('installText');
  document.getElementById('installBtn').textContent = t('installBtn');

  const reminderBanner = document.getElementById('reminderBanner');
  if (state.tab === 'home' || state.tab === 'saved') {
    const { todayList, tomorrowList } = savedReminders();
    const list = todayList.length ? todayList : tomorrowList;
    if (list.length) {
      const label = todayList.length ? t('reminderToday') : t('reminderTomorrow');
      reminderBanner.innerHTML = `<span>⏰</span><span>${label} ${list.map(evTitle).join(', ')}</span>`;
      reminderBanner.classList.add('show');
    } else {
      reminderBanner.classList.remove('show');
    }
  } else {
    reminderBanner.classList.remove('show');
  }

  renderFilters();
  if (state.tab === 'home') renderHome();
  else if (state.tab === 'explore') renderExplore();
  else if (state.tab === 'saved') renderSaved();
  else if (state.tab === 'profile') renderProfile();

  document.querySelectorAll('.navitem').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === state.tab);
  });
}

/* ===================== DETAIL MODAL ===================== */
const backdrop = document.getElementById('modalBackdrop');
const modalEl = document.getElementById('modal');

function openDetail(id) {
  const ev = EVENTS.find(e => e.id === id);
  if (!ev) return;
  const isSaved = state.saved.has(ev.id);
  modalEl.innerHTML = `
    <div class="modal-handle"></div>
    <h2>${ev.icon} ${evTitle(ev)}</h2>
    <div class="m-meta">${ev.venue}<br>${evWhen(ev)}</div>
    <div class="m-tags">${tagsHtml(ev)}</div>
    <div class="m-desc">${evDesc(ev)}</div>
    <div class="m-actions">
      <button class="btn ghost" id="modalSave">${isSaved ? t('modalSaveOn') : t('modalSaveOff')}</button>
      ${ev.source ? `<a class="btn primary" href="${ev.source}" target="_blank" rel="noopener">${t('viewSource')}</a>` : `<button class="btn primary" disabled style="opacity:.5">${t('noSourceLink')}</button>`}
    </div>
  `;
  backdrop.classList.add('open');
  document.getElementById('modalSave').onclick = () => {
    if (state.saved.has(ev.id)) state.saved.delete(ev.id); else state.saved.add(ev.id);
    persistSaved();
    closeDetail();
    render();
  };
}
function closeDetail() { backdrop.classList.remove('open'); }
backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeDetail(); });

/* ===================== EVENTS ===================== */
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  render();
});
document.querySelectorAll('.navitem').forEach(btn => {
  btn.addEventListener('click', () => { state.tab = btn.dataset.tab; render(); });
});

/* ===================== INSTALL PROMPT ===================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
});

/* ===================== SERVICE WORKER ===================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

/* ===================== INIT ===================== */
render();
</script>
</body>
</html>
